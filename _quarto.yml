project:
  type: website
  resources:
    - assets/favicon.svg
    - assets/apple-touch-icon.png
    - assets/icon-192.png
    - assets/icon-512.png
    - assets/scale.js
    - site.webmanifest

website:
  title: "Sjochengberg Recipes"
  favicon: assets/favicon.ico
  navbar:
    right:
      - icon: github
        href: https://github.com/ddsjoberg/recipes
        aria-label: GitHub repository

format:
  html:
    theme:
      light: [yeti, styles.scss]
      dark: [yeti, styles.scss, styles-dark.scss]
    respect-user-color-scheme: true
    css: assets/recipes.css
    include-in-header: assets/head.html
    filters:
      - _filters/recipe.lua

editor: visual
